# Install in <worker>.container.d/, alongside the host's Quadlet source.
[Container]
# Reap orphaned children (shell wrappers, Git helpers, MPI daemons) as they exit. Ignoring this can lead to zombie processes and resource leaks.
RunInit=true
# Bound processes AND threads; keep containment rather than masking a leak. Adjust depending on the workload.
PidsLimit=2048
